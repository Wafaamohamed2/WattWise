<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WattWise - Create Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="auth-helper.js"></script>

    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-slate-100">

    <div class="glass-panel w-full max-w-md rounded-3xl p-8 border border-slate-800 shadow-2xl space-y-6">
        
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center mx-auto shadow-xl shadow-emerald-500/20">
                <i class="fa-solid fa-bolt text-2xl text-slate-950"></i>
            </div>
            <h2 class="text-2xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Create Account</h2>
            <p class="text-xs text-slate-400">Join WattWise to optimize your energy consumption</p>
        </div>

        <div id="message" class="hidden text-xs p-3 rounded-xl border text-center"></div>

        <!-- Registration Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
                <input type="text" id="fullName" placeholder="e.g. Ahmed Mohamed" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-emerald-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-emerald-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-emerald-500 transition">
                <div class="text-[10px] text-slate-500 mt-1">Min 6 characters, digits and letters.</div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat your password" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-emerald-500 transition">
            </div>

            <button id="registerBtn" onclick="handleRegister()" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 hover:opacity-95 transition">
                Create Account &rarr;
            </button>
        </div>

        <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-800">
            Already have an account? <a href="login.html" class="text-emerald-400 font-semibold hover:underline">Sign in</a>
        </div>

    </div>

    <!-- Script -->
    <script>
        async function handleRegister() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('registerBtn');

            if (!fullName || !email || !password || !confirmPassword) {
                showMessage('Please fill in all fields.', 'danger');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', 'danger');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const response = await AuthHelper.fetchWithAuth('/api/v1/account/register', {
                    method: 'POST',
                    body: JSON.stringify({ email, password, fullName })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('Account created! Signing you in...', 'success');

                    const loginResponse = await AuthHelper.fetchWithAuth('/api/v1/account/login', {
                        method: 'POST',
                        body: JSON.stringify({ email, password })
                    });

                    if (loginResponse.ok) {
                        const buildings = await AuthHelper.checkOnboardingStatus(true);
                        if (buildings) window.location.href = 'index.html';
                    } else {
                        showMessage('Account created! Please sign in.', 'success');
                        setTimeout(() => window.location.href = 'login.html', 1500);
                    }
                } else {
                    showMessage(result.message || 'Registration failed. Please try again.', 'danger');
                    btn.disabled = false;
                    btn.textContent = 'Create Account →';
                }
            } catch (error) {
                showMessage('Could not connect to server.', 'danger');
                btn.disabled = false;
                btn.textContent = 'Create Account →';
            }
        }

        function showMessage(text, type) {
            const div = document.getElementById('message');
            div.textContent = text;
            div.classList.remove('hidden');
            if (type === 'success') {
                div.className = 'text-xs p-3 rounded-xl border text-center text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
            } else {
                div.className = 'text-xs p-3 rounded-xl border text-center text-rose-400 bg-rose-500/10 border-rose-500/30';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleRegister();
        });
    </script>
</body>

</html>
