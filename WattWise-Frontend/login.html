<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WattWise - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="auth-helper.js"></script>

    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950">

    <!-- Background glow circles -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-1/4 left-1/3 w-80 h-80 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md glass-panel rounded-3xl p-8 shadow-2xl space-y-6 relative z-10">
        
        <!-- Brand Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 mx-auto">
                <i class="fa-solid fa-bolt text-2xl text-slate-950"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">WattWise Energy Hub</h2>
            <p class="text-slate-400 text-xs">Sign in to your smart energy optimizer account</p>
        </div>

        <!-- Form Controls -->
        <div class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email"
                    class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800 text-white text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="text-xs font-semibold text-slate-300">Password</label>
                    <a href="#" class="text-xs text-emerald-400 hover:underline font-medium" onclick="requestForgotPassword(event)">Forgot password?</a>
                </div>
                <input type="password" id="password" placeholder="Your password" autocomplete="current-password"
                    class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800 text-white text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
            </div>

            <button id="loginBtn" onclick="doLogin()"
                class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 hover:opacity-95 active:scale-[0.99] transition duration-200">
                Sign In &rarr;
            </button>

            <div id="message" class="text-xs text-center min-h-[20px]"></div>

            <div id="resendContainer" class="hidden text-center">
                <a href="#" id="resendBtn" onclick="resendVerification(event)" class="text-xs font-semibold text-emerald-400 hover:underline">
                    📩 Didn't receive verification email? Click to resend
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center pt-4 border-t border-slate-800/60 text-xs text-slate-400">
            Don't have an account? <a href="register.html" class="text-emerald-400 font-semibold hover:underline">Create one</a>
        </div>
    </div>

    <script>
        async function doLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('message');
            const resendBox = document.getElementById('resendContainer');

            if (!email || !password) { showMsg('Please fill in all fields.', false); return; }

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            msg.textContent = '';
            resendBox.classList.add('hidden');

            try {
                const res = await AuthHelper.fetchWithAuth('/api/v1/account/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                const body = await res.json();

                if (!res.ok) {
                    const errorText = body.message ?? body.Message ?? 'Login failed';
                    showMsg(errorText, false);
                    btn.disabled = false;
                    btn.textContent = 'Sign In →';

                    if (errorText.toLowerCase().includes('confirm') || errorText.toLowerCase().includes('email')) {
                        resendBox.classList.remove('hidden');
                    }
                    return;
                }

                showMsg('Login successful! Checking onboarding...', true);
                const buildings = await AuthHelper.checkOnboardingStatus(true);
                if (buildings) {
                    window.location.href = 'index.html';
                }

            } catch (err) {
                showMsg('Connection error: Make sure backend API is running on https://localhost:7083 or http://localhost:5167', false);
                btn.disabled = false;
                btn.textContent = 'Sign In →';
            }
        }

        async function resendVerification(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const resendBtn = document.getElementById('resendBtn');
            if (!email) {
                showMsg('Please enter your email address first.', false);
                return;
            }

            resendBtn.innerText = 'Sending verification link...';
            resendBtn.style.pointerEvents = 'none';

            try {
                const res = await AuthHelper.fetchWithAuth('/api/v1/account/resend-confirmation-email', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });

                const body = await res.json();
                showMsg(body.message ?? body.Message ?? 'Verification email sent!', true);
            } catch (err) {
                showMsg('Failed to send verification email: ' + err.message, false);
            } finally {
                resendBtn.innerText = '📩 Didn\'t receive verification email? Click to resend';
                resendBtn.style.pointerEvents = 'auto';
            }
        }

        async function requestForgotPassword(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const email = emailInput || prompt('Please enter your email address to reset your password:');
            if (!email) return;

            showMsg('Sending password reset email...', true);

            try {
                const res = await AuthHelper.fetchWithAuth('/api/v1/account/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });

                const body = await res.json();
                showMsg(body.message ?? body.Message ?? 'If an account exists, a reset link has been sent.', true);
            } catch (err) {
                showMsg('Failed to send reset link: ' + err.message, false);
            }
        }

        function showMsg(text, ok) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'text-xs text-center min-h-[20px] ' + (ok ? 'text-emerald-400 font-medium' : 'text-rose-400 font-medium');
        }

        document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>

</html>
