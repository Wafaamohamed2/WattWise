<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WattWise - Energy Anomalies</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="auth-helper.js"></script>

    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 gap-4">
                
                <!-- Logo & Brand -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                        <i class="fa-solid fa-bolt text-xl text-slate-950"></i>
                    </div>
                    <div>
                        <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">WattWise</a>
                        <span class="text-xs text-emerald-400 font-medium hidden sm:inline-block ml-1">Anomalies</span>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <nav class="hidden md:flex items-center gap-1 overflow-x-auto py-1">
                    <a href="index.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-house text-xs"></i> Monitor
                    </a>
                    <a href="ai-dashboard.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-robot text-xs"></i> AI Insights
                    </a>
                    <a href="recommendations.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-lightbulb text-xs"></i> Recs
                    </a>
                    <a href="anomalies.html" class="nav-link active px-3 py-1.5 rounded-lg text-sm font-semibold border border-transparent flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-xs"></i> Anomalies
                    </a>
                    <a href="analysis-history.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-xs"></i> History
                    </a>
                    <a href="charts.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-xs"></i> Analytics
                    </a>
                    <a href="setup.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-gear text-xs"></i> Setup
                    </a>
                </nav>

                <!-- Logout Button -->
                <button onclick="AuthHelper.logout()" title="Logout" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-rose-400 hover:border-rose-500/30 transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>

            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Header Banner -->
        <div class="glass-panel rounded-3xl p-6 border border-slate-800">
            <h1 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-3">
                <i class="fa-solid fa-triangle-exclamation text-rose-400"></i> Energy Anomalies
            </h1>
            <p class="text-slate-400 text-xs md:text-sm mt-1">Detected abnormal power spikes, device malfunctions, and unexpected consumption patterns</p>
        </div>

        <!-- Anomalies Stats Bar Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <div class="glass-panel rounded-2xl p-4 border border-slate-800 text-center">
                <div class="text-xs text-rose-400 mb-1">CRITICAL</div>
                <div id="criticalCount" class="text-2xl font-bold text-rose-400">-</div>
            </div>
            <div class="glass-panel rounded-2xl p-4 border border-slate-800 text-center">
                <div class="text-xs text-amber-400 mb-1">HIGH</div>
                <div id="highCount" class="text-2xl font-bold text-amber-400">-</div>
            </div>
            <div class="glass-panel rounded-2xl p-4 border border-slate-800 text-center">
                <div class="text-xs text-yellow-400 mb-1">MEDIUM</div>
                <div id="mediumCount" class="text-2xl font-bold text-yellow-400">-</div>
            </div>
            <div class="glass-panel rounded-2xl p-4 border border-slate-800 text-center">
                <div class="text-xs text-rose-400 mb-1">UNRESOLVED</div>
                <div id="unresolvedCount" class="text-2xl font-bold text-rose-400">-</div>
            </div>
            <div class="glass-panel rounded-2xl p-4 border border-slate-800 text-center">
                <div class="text-xs text-emerald-400 mb-1">RESOLVED</div>
                <div id="resolvedCount" class="text-2xl font-bold text-emerald-400">-</div>
            </div>
            <div class="glass-panel rounded-2xl p-4 border border-slate-800 text-center">
                <div class="text-xs text-teal-400 mb-1">AFFECTED</div>
                <div id="devicesAffected" class="text-2xl font-bold text-teal-400">-</div>
            </div>
        </div>

        <!-- Filter Bar Grid -->
        <div class="glass-panel rounded-2xl p-4 border border-slate-800 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Status</label>
                <select id="filterStatus" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
                    <option value="">All Statuses</option>
                    <option value="false" selected>Unresolved Only</option>
                    <option value="true">Resolved</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Severity</label>
                <select id="filterSeverity" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
                    <option value="">All Severities</option>
                    <option value="Critical">Critical</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Device</label>
                <select id="filterDevice" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
                    <option value="">All Devices</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Start Date</label>
                <input type="date" id="filterStartDate" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">End Date</label>
                <input type="date" id="filterEndDate" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- Anomalies List Container -->
        <div class="space-y-4">
            <div id="anomaliesList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full py-12 text-center text-slate-500">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-500 mb-2"></i>
                    <p class="text-sm">Loading anomalies...</p>
                </div>
            </div>

            <!-- Pagination Bar -->
            <div id="pagination" class="flex items-center justify-between glass-panel rounded-2xl p-4 border border-slate-800 text-xs hidden">
                <!-- Pagination buttons inserted by JS -->
            </div>
        </div>

    </main>

    <!-- Resolve Modal -->
    <div id="resolveModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="glass-panel rounded-3xl p-6 border border-slate-800 w-full max-w-md space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-check-circle text-emerald-400"></i> Resolve Anomaly
                </h3>
                <button onclick="closeResolveModal()" class="text-slate-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-2">Resolution Notes</label>
                <textarea id="resolutionNotes" rows="4" placeholder="Describe how this anomaly was resolved..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-emerald-500"></textarea>
            </div>
            <div class="flex items-center justify-end gap-3 pt-2">
                <button onclick="closeResolveModal()" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-400 text-xs font-semibold border border-slate-800 transition">Cancel</button>
                <button onclick="confirmResolve()" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold transition shadow-lg shadow-emerald-500/20">Resolve Anomaly</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const baseUrl = AuthHelper.API_BASE_URL;
        let currentPage = 1;
        let totalPages = 1;
        let currentAnomalyId = null;

        async function loadAnomalies() {
            try {
                const params = new URLSearchParams({ page: currentPage, pageSize: 10 });

                const status = document.getElementById('filterStatus').value;
                const severity = document.getElementById('filterSeverity').value;
                const device = document.getElementById('filterDevice').value;
                const startDate = document.getElementById('filterStartDate').value;
                const endDate = document.getElementById('filterEndDate').value;

                if (status !== '') params.append('isResolved', status);
                if (severity) params.append('severity', severity);
                if (device) params.append('deviceId', device);
                if (startDate) params.append('startDate', startDate);
                if (endDate) params.append('endDate', endDate);

                const response = await AuthHelper.fetchWithAuth(`${baseUrl}/api/v1/AI/anomalies?${params}`, { cache: "no-cache" });
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

                const result = await response.json();
                const details = result.data ?? result.details ?? result ?? {};
                const anomalies = Array.isArray(details) ? details : (details.items ?? details.data ?? []);

                displayAnomalies(anomalies);
                displayPagination(details.page || 1, details.totalPages || 1);

                try {
                    const statsResp = await AuthHelper.fetchWithAuth(`${baseUrl}/api/v1/AI/Statistics`);
                    const statsResult = await statsResp.json();
                    const s = statsResult.data ?? statsResult.details ?? statsResult ?? {};
                    const anom = s.anomalies ?? {};
                    displayStatistics({
                        critical: anom.criticalSeverityCount ?? 0,
                        high: anom.highSeverityCount ?? 0,
                        medium: anom.mediumSeverityCount ?? 0,
                        unresolved: anom.unresolved ?? 0,
                        resolved: (anom.total ?? 0) - (anom.unresolved ?? 0),
                        devicesAffected: anom.devicesAffected ?? anom.total ?? 0
                    });
                } catch (e) {}

            } catch (error) {
                console.error('Error loading anomalies:', error);
                document.getElementById('anomaliesList').innerHTML = `
                    <div class="col-span-full py-12 text-center text-rose-400 text-sm">
                        ⚠️ Failed to load anomalies: ${error.message}
                    </div>
                `;
            }
        }

        function applyFilters() {
            currentPage = 1;
            loadAnomalies();
        }

        function displayStatistics(stats) {
            document.getElementById('criticalCount').textContent = stats.critical ?? 0;
            document.getElementById('highCount').textContent = stats.high ?? 0;
            document.getElementById('mediumCount').textContent = stats.medium ?? 0;
            document.getElementById('unresolvedCount').textContent = stats.unresolved ?? 0;
            document.getElementById('resolvedCount').textContent = stats.resolved ?? 0;
            document.getElementById('devicesAffected').textContent = stats.devicesAffected ?? 0;
        }

        function displayAnomalies(anomalies) {
            const container = document.getElementById('anomaliesList');
            if (!anomalies || anomalies.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-500 text-sm">
                        <i class="fa-solid fa-shield-halved text-4xl text-emerald-500/40 mb-3"></i>
                        <p class="text-slate-300 font-semibold">No anomalies detected</p>
                        <p class="text-slate-500 text-xs mt-1">All monitored systems are running efficiently</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = anomalies.map(a => {
                const dev = a.device || { name: 'Unknown Device', zone: 'Unknown' };
                const severity = a.severity || a.severityLabel || 'Medium';

                const severityBadge = severity.toLowerCase() === 'critical' ?
                    'text-rose-400 bg-rose-500/10 border-rose-500/30' :
                    severity.toLowerCase() === 'high' ?
                    'text-amber-400 bg-amber-500/10 border-amber-500/30' :
                    'text-yellow-400 bg-yellow-500/10 border-yellow-500/30';

                return `
                    <div class="glass-panel rounded-2xl p-5 border border-slate-800 space-y-3 flex flex-col justify-between">
                        <div class="space-y-2">
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <h4 class="font-bold text-white text-sm">⚠️ ${dev.name || 'Unknown Device'}</h4>
                                    <div class="text-[11px] text-slate-400 flex items-center gap-2 mt-0.5">
                                        <span>📍 ${typeof dev.zone === 'object' && dev.zone ? (dev.zone.name || dev.zone.Name || 'Main') : (dev.zone || 'Main')}</span>
                                        <span>🕐 ${new Date(a.anomalyTimestamp || a.detectedAt).toLocaleTimeString()}</span>
                                    </div>
                                </div>
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${severityBadge}">
                                    ${severity}
                                </span>
                            </div>
                            <p class="text-xs text-slate-300 leading-relaxed">${a.description || 'Abnormal usage pattern detected'}</p>
                            
                            <div class="grid grid-cols-3 gap-2 p-3 rounded-xl bg-slate-950/60 border border-slate-900 text-center text-xs">
                                <div>
                                    <span class="text-[10px] text-slate-500 block">Expected</span>
                                    <span class="font-bold text-slate-300">${(a.expectedValue || 0).toFixed(2)} kW</span>
                                </div>
                                <div>
                                    <span class="text-[10px] text-slate-500 block">Actual</span>
                                    <span class="font-bold text-rose-400">${(a.actualValue || 0).toFixed(2)} kW</span>
                                </div>
                                <div>
                                    <span class="text-[10px] text-slate-500 block">Deviation</span>
                                    <span class="font-bold text-amber-400">+${a.expectedValue ? Math.round(((a.actualValue / a.expectedValue) - 1) * 100) : 0}%</span>
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 flex items-center justify-end">
                            ${!a.isResolved ? `
                                <button onclick="openResolveModal(${a.id})" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold transition shadow-md shadow-emerald-500/10 flex items-center gap-1">
                                    <i class="fa-solid fa-check"></i> Resolve
                                </button>
                            ` : `
                                <span class="text-xs text-slate-500 font-semibold flex items-center gap-1"><i class="fa-solid fa-check-circle text-emerald-400"></i> Resolved</span>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function displayPagination(page, total) {
            totalPages = total;
            const pagination = document.getElementById('pagination');
            if (total <= 1) {
                pagination.classList.add('hidden');
                return;
            }
            pagination.classList.remove('hidden');
            pagination.innerHTML = `
                <button onclick="currentPage--; loadAnomalies()" ${page === 1 ? 'disabled class="opacity-50 text-slate-500"' : 'class="text-emerald-400 font-bold hover:underline"'}>&larr; Previous</button>
                <span class="text-slate-400">Page ${page} of ${total}</span>
                <button onclick="currentPage++; loadAnomalies()" ${page === total ? 'disabled class="opacity-50 text-slate-500"' : 'class="text-emerald-400 font-bold hover:underline"'}>Next &rarr;</button>
            `;
        }

        function openResolveModal(id) {
            currentAnomalyId = id;
            document.getElementById('resolveModal').classList.remove('hidden');
        }

        function closeResolveModal() {
            document.getElementById('resolveModal').classList.add('hidden');
        }

        async function confirmResolve() {
            const notes = document.getElementById('resolutionNotes').value.trim();
            if (!notes) return alert('Please enter resolution notes');

            try {
                const response = await AuthHelper.fetchWithAuth(`${baseUrl}/api/v1/AI/anomalies/${currentAnomalyId}/resolve`, {
                    method: 'PATCH',
                    body: JSON.stringify({ resolutionNotes: notes })
                });

                if (response.ok) {
                    closeResolveModal();
                    loadAnomalies();
                }
            } catch (error) {
                console.error('Error resolving anomaly:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await AuthHelper.checkAuth();
            loadAnomalies();
        });
    </script>
</body>

</html>
