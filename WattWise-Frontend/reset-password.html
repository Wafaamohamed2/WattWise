<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password - WattWise</title>
    <script src="auth-helper.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h2 {
            font-size: 1.6rem;
            color: #1f2937;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            display: none;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="card">
        <h2 id="pageTitle">Reset Your Password</h2>
        <p id="pageDesc">Enter your new password below.</p>

        <div id="alertBox" class="alert"></div>

        <form id="resetForm" onsubmit="handleResetPassword(event)">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Repeat new password">
            </div>

            <div class="spinner" id="spinner"></div>

            <button type="submit" class="btn" id="submitBtn">Set New Password</button>
        </form>

        <a href="login.html" class="btn" id="loginBtn" style="display: none; margin-top: 15px;">Back to Login</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');
        const token = params.get('token');

        const alertBox = document.getElementById('alertBox');
        const spinner = document.getElementById('spinner');
        const submitBtn = document.getElementById('submitBtn');
        const resetForm = document.getElementById('resetForm');
        const loginBtn = document.getElementById('loginBtn');

        if (!email || !token) {
            showAlert('Invalid or missing password reset link parameters. Please request a new link from the login page.', 'error');
            resetForm.style.display = 'none';
            loginBtn.style.display = 'inline-block';
        }

        function showAlert(msg, type) {
            alertBox.innerText = msg;
            alertBox.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
            alertBox.style.display = 'block';
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match. Please re-enter.', 'error');
                return;
            }

            alertBox.style.display = 'none';
            spinner.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const res = await fetch(AuthHelper.API_BASE_URL + '/api/v1/account/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, newPassword })
                });

                const data = await res.json();
                spinner.style.display = 'none';

                if (res.ok) {
                    showAlert(data.message ?? 'Password reset successfully! You can now log in.', 'success');
                    resetForm.style.display = 'none';
                    loginBtn.style.display = 'inline-block';
                } else {
                    showAlert(data.message ?? 'Failed to reset password. The link may have expired.', 'error');
                    submitBtn.disabled = false;
                }
            } catch (err) {
                spinner.style.display = 'none';
                showAlert('Connection error: ' + err.message, 'error');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
