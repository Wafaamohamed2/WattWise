<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WattWise - Reset Password</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="auth-helper.js"></script>
    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-slate-100">

    <!-- Glowing Background Accents -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="glass-panel w-full max-w-md rounded-3xl p-8 shadow-2xl space-y-6 relative z-10 border border-slate-800">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center mx-auto shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-key text-2xl text-slate-950"></i>
            </div>
            <h2 id="pageTitle" class="text-2xl font-bold text-white tracking-tight">Reset Your Password</h2>
            <p id="pageDesc" class="text-slate-400 text-xs">Enter your new password below to secure your account.</p>
        </div>

        <div id="alertBox" class="hidden text-xs p-3 rounded-xl border text-center font-medium"></div>

        <form id="resetForm" onsubmit="handleResetPassword(event)" class="space-y-4">
            <div>
                <label for="newPassword" class="block text-xs font-semibold text-slate-300 mb-1">New Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="Min 6 characters"
                    class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800 text-white text-sm outline-none focus:border-emerald-500 transition">
            </div>

            <div>
                <label for="confirmPassword" class="block text-xs font-semibold text-slate-300 mb-1">Confirm New Password</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Repeat new password"
                    class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800 text-white text-sm outline-none focus:border-emerald-500 transition">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 hover:opacity-95 transition">
                Set New Password &rarr;
            </button>
        </form>

        <a href="login.html" id="loginBtn" class="hidden block w-full text-center py-3.5 rounded-xl bg-slate-800 text-emerald-400 font-bold text-sm hover:bg-slate-700 transition">
            Back to Login &rarr;
        </a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');
        const token = params.get('token');

        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const resetForm = document.getElementById('resetForm');
        const loginBtn = document.getElementById('loginBtn');

        if (!email || !token) {
            showAlert('Invalid or missing password reset parameters. Please request a new reset link.', 'error');
            resetForm.classList.add('hidden');
            loginBtn.classList.remove('hidden');
        }

        function showAlert(msg, type) {
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
            if (type === 'success') {
                alertBox.className = 'text-xs p-3 rounded-xl border text-center font-medium text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
            } else {
                alertBox.className = 'text-xs p-3 rounded-xl border text-center font-medium text-rose-400 bg-rose-500/10 border-rose-500/30';
            }
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match. Please re-enter.', 'error');
                return;
            }

            alertBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating Password...';

            try {
                const res = await AuthHelper.fetchWithAuth('/api/v1/account/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({ email, token, newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert(data.message ?? 'Password reset successfully! You can now log in.', 'success');
                    resetForm.classList.add('hidden');
                    loginBtn.classList.remove('hidden');
                } else {
                    showAlert(data.message ?? 'Failed to reset password. The link may have expired.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Set New Password →';
                }
            } catch (err) {
                showAlert('Connection error: ' + err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Set New Password →';
            }
        }
    </script>
</body>

</html>
