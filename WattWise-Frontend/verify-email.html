<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WattWise - Email Verification</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="auth-helper.js"></script>
    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-slate-100">

    <!-- Glowing Background Accents -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="glass-panel w-full max-w-md rounded-3xl p-8 shadow-2xl space-y-6 text-center relative z-10 border border-slate-800">
        
        <!-- Status Icon -->
        <div id="iconBox" class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-2xl shadow-lg">
            <i id="statusIcon" class="fa-solid fa-circle-notch fa-spin"></i>
        </div>

        <h2 id="statusTitle" class="text-2xl font-bold text-white tracking-tight">Verifying your email...</h2>
        <p id="statusDesc" class="text-slate-400 text-xs leading-relaxed">Please wait while we confirm your email address with the server.</p>

        <a href="login.html" id="loginLink" class="hidden w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 hover:opacity-95 transition">
            Proceed to Login &rarr;
        </a>
    </div>

    <script>
        async function verifyEmail() {
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('userId');
            const token = params.get('token');

            const iconBox = document.getElementById('iconBox');
            const icon = document.getElementById('statusIcon');
            const title = document.getElementById('statusTitle');
            const desc = document.getElementById('statusDesc');
            const btn = document.getElementById('loginLink');

            if (!userId || !token) {
                iconBox.className = 'w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mx-auto text-2xl shadow-lg';
                icon.className = 'fa-solid fa-circle-xmark';
                title.innerText = 'Invalid Link';
                desc.innerText = 'The verification link is incomplete or corrupted. Please request a new verification link from the login page.';
                btn.classList.remove('hidden');
                return;
            }

            try {
                const res = await AuthHelper.fetchWithAuth('/api/v1/account/verify-email', {
                    method: 'POST',
                    body: JSON.stringify({ userId, token })
                });

                const body = await res.json();

                if (res.ok) {
                    iconBox.className = 'w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-2xl shadow-lg';
                    icon.className = 'fa-solid fa-circle-check';
                    title.innerText = 'Email Verified!';
                    desc.innerText = body.message ?? body.Message ?? 'Your email address has been successfully verified. You can now sign in to your account.';
                } else {
                    iconBox.className = 'w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center mx-auto text-2xl shadow-lg';
                    icon.className = 'fa-solid fa-triangle-exclamation';
                    title.innerText = 'Verification Failed';
                    desc.innerText = body.message ?? body.Message ?? 'Failed to verify email. The link may have expired or already been used.';
                }
            } catch (err) {
                iconBox.className = 'w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mx-auto text-2xl shadow-lg';
                icon.className = 'fa-solid fa-wifi';
                title.innerText = 'Connection Error';
                desc.innerText = 'Could not connect to the server: ' + err.message;
            } finally {
                btn.classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', verifyEmail);
    </script>
</body>

</html>
