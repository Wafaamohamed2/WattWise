<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WattWise - Change Password</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="auth-helper.js"></script>
    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-slate-100">

    <!-- Glowing Background Accents -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="glass-panel w-full max-w-md rounded-3xl p-8 shadow-2xl space-y-6 relative z-10 border border-slate-800">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center mx-auto shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-lock text-2xl text-slate-950"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Change Your Password</h2>
            <p class="text-slate-400 text-xs">Update your password for your WattWise account.</p>
        </div>

        <div id="alertBox" class="hidden text-xs p-3 rounded-xl border text-center font-medium"></div>

        <form id="changeForm" onsubmit="handleChangePassword(event)" class="space-y-4">
            <div>
                <label for="currentPassword" class="block text-xs font-semibold text-slate-300 mb-1">Current Password</label>
                <input type="password" id="currentPassword" required placeholder="Enter current password"
                    class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800 text-white text-sm outline-none focus:border-emerald-500 transition">
            </div>

            <div>
                <label for="newPassword" class="block text-xs font-semibold text-slate-300 mb-1">New Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters"
                    class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800 text-white text-sm outline-none focus:border-emerald-500 transition">
            </div>

            <div>
                <label for="confirmNewPassword" class="block text-xs font-semibold text-slate-300 mb-1">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" required minlength="6" placeholder="Repeat new password"
                    class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-800 text-white text-sm outline-none focus:border-emerald-500 transition">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 hover:opacity-95 transition">
                Update Password &rarr;
            </button>
        </form>

        <a href="index.html" id="backBtn" class="block w-full text-center py-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 font-semibold text-xs hover:bg-slate-800 transition">
            &larr; Back to Dashboard
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const authenticated = await AuthHelper.checkAuth();
            if (!authenticated) return;
        });

        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const changeForm = document.getElementById('changeForm');

        function showAlert(msg, type) {
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
            if (type === 'success') {
                alertBox.className = 'text-xs p-3 rounded-xl border text-center font-medium text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
            } else {
                alertBox.className = 'text-xs p-3 rounded-xl border text-center font-medium text-rose-400 bg-rose-500/10 border-rose-500/30';
            }
        }

        async function handleChangePassword(event) {
            event.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                showAlert('New passwords do not match. Please re-enter.', 'error');
                return;
            }

            if (currentPassword === newPassword) {
                showAlert('New password cannot be the same as current password.', 'error');
                return;
            }

            alertBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating Password...';

            try {
                const res = await AuthHelper.fetchWithAuth('/api/v1/account/change-password', {
                    method: 'POST',
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                if (res && res.ok) {
                    showAlert('Password updated successfully! Redirecting to login...', 'success');
                    changeForm.classList.add('hidden');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else if (res) {
                    const data = await res.json();
                    showAlert(data.message ?? 'Failed to update password. Please check your current password.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Update Password →';
                }
            } catch (err) {
                showAlert('Connection error: ' + err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password →';
            }
        }
    </script>
</body>

</html>
