<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Change Password - WattWise</title>
    <script src="auth-helper.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h2 {
            font-size: 1.6rem;
            color: #1f2937;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            display: none;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Change Your Password</h2>
        <p>Update your password for your WattWise account.</p>

        <div id="alertBox" class="alert"></div>

        <form id="changeForm" onsubmit="handleChangePassword(event)">
            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" required placeholder="Enter current password">
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" required minlength="6" placeholder="Repeat new password">
            </div>

            <div class="spinner" id="spinner"></div>

            <button type="submit" class="btn" id="submitBtn">Update Password</button>
        </form>

        <a href="index.html" class="btn" id="backBtn" style="background: #e5e7eb; color: #374151; margin-top: 12px; display: inline-block;">Back to Dashboard</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const authenticated = await AuthHelper.checkAuth();
            if (!authenticated) return;
        });

        const alertBox = document.getElementById('alertBox');
        const spinner = document.getElementById('spinner');
        const submitBtn = document.getElementById('submitBtn');
        const changeForm = document.getElementById('changeForm');

        function showAlert(msg, type) {
            alertBox.innerText = msg;
            alertBox.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
            alertBox.style.display = 'block';
        }

        async function handleChangePassword(event) {
            event.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                showAlert('New passwords do not match. Please re-enter.', 'error');
                return;
            }

            if (currentPassword === newPassword) {
                showAlert('New password cannot be the same as current password.', 'error');
                return;
            }

            alertBox.style.display = 'none';
            spinner.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const res = await AuthHelper.fetchWithAuth('/api/v1/account/change-password', {
                    method: 'POST',
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                spinner.style.display = 'none';

                if (res && res.ok) {
                    showAlert('Password updated successfully! Please log in with your new password.', 'success');
                    changeForm.style.display = 'none';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else if (res) {
                    const data = await res.json();
                    showAlert(data.message ?? 'Failed to update password. Please check your current password.', 'error');
                    submitBtn.disabled = false;
                }
            } catch (err) {
                spinner.style.display = 'none';
                showAlert('Connection error: ' + err.message, 'error');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
