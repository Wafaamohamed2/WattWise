<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WattWise - Analysis History</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="auth-helper.js"></script>

    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 gap-4">
                
                <!-- Logo & Brand -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                        <i class="fa-solid fa-bolt text-xl text-slate-950"></i>
                    </div>
                    <div>
                        <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">WattWise</a>
                        <span class="text-xs text-emerald-400 font-medium hidden sm:inline-block ml-1">Analysis History</span>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <nav class="hidden md:flex items-center gap-1 overflow-x-auto py-1">
                    <a href="index.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-house text-xs"></i> Monitor
                    </a>
                    <a href="ai-dashboard.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-robot text-xs"></i> AI Insights
                    </a>
                    <a href="recommendations.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-lightbulb text-xs"></i> Recs
                    </a>
                    <a href="anomalies.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-xs"></i> Anomalies
                    </a>
                    <a href="analysis-history.html" class="nav-link active px-3 py-1.5 rounded-lg text-sm font-semibold border border-transparent flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-xs"></i> History
                    </a>
                    <a href="charts.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-xs"></i> Analytics
                    </a>
                    <a href="setup.html" class="nav-link px-3 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 flex items-center gap-2">
                        <i class="fa-solid fa-gear text-xs"></i> Setup
                    </a>
                </nav>

                <!-- Action Button -->
                <div class="flex items-center gap-3">
                    <button onclick="runNewAnalysis()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold text-xs shadow-lg shadow-emerald-500/20 hover:opacity-90 transition flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Run Analysis
                    </button>
                    <button onclick="AuthHelper.logout()" title="Logout" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-rose-400 hover:border-rose-500/30 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Header Banner -->
        <div class="glass-panel rounded-3xl p-6 border border-slate-800">
            <h1 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-3">
                <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i> AI Analysis History
            </h1>
            <p class="text-slate-400 text-xs md:text-sm mt-1">Review historical pattern execution logs, insights, recommendations, and anomaly reports</p>
        </div>

        <!-- Filter Bar Grid -->
        <div class="glass-panel rounded-2xl p-4 border border-slate-800 grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Analysis Type</label>
                <select id="filterType" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
                    <option value="">All Types</option>
                    <option value="PatternRecognition">Pattern Recognition</option>
                    <option value="AnomalyDetection">Anomaly Detection</option>
                    <option value="Optimization">Optimization</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Start Date</label>
                <input type="date" id="filterStartDate" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">End Date</label>
                <input type="date" id="filterEndDate" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
            </div>
        </div>

        <!-- History Items Container -->
        <div class="space-y-4">
            <div id="historyList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full py-12 text-center text-slate-500">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-500 mb-2"></i>
                    <p class="text-sm">Loading historical analysis logs...</p>
                </div>
            </div>

            <!-- Pagination Bar -->
            <div id="pagination" class="flex items-center justify-between glass-panel rounded-2xl p-4 border border-slate-800 text-xs hidden">
                <!-- Pagination -->
            </div>
        </div>

    </main>

    <!-- Analysis Detail Modal -->
    <div id="detailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="glass-panel rounded-3xl p-6 border border-slate-800 w-full max-w-2xl max-h-[85vh] flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-lines text-emerald-400"></i> Analysis Report Details
                </h3>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modalBody" class="flex-1 overflow-y-auto space-y-4 pr-1 text-xs text-slate-300">
                <!-- Dynamic Content -->
            </div>
            <div class="flex items-center justify-end pt-3 border-t border-slate-800">
                <button onclick="closeDetailModal()" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-semibold border border-slate-800 transition">Close</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const baseUrl = AuthHelper.API_BASE_URL;
        let currentPage = 1;
        let totalPages = 1;
        let currentFilters = { analysisType: '', startDate: '', endDate: '' };

        async function loadHistory() {
            try {
                const params = new URLSearchParams({ page: currentPage, pageSize: 10 });
                if (currentFilters.analysisType) params.append('analysisType', currentFilters.analysisType);
                if (currentFilters.startDate) params.append('startDate', currentFilters.startDate);
                if (currentFilters.endDate) params.append('endDate', currentFilters.endDate);

                const response = await AuthHelper.fetchWithAuth(`${baseUrl}/api/v1/AI/analysis-history?${params}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

                const result = await response.json();
                const payload = result.Details ?? result.details ?? result.data ?? result;
                const items = Array.isArray(payload) ? payload : (payload.items ?? payload.data ?? []);

                displayHistory(items);
                displayPagination(payload.page || 1, payload.totalPages || 1);

            } catch (error) {
                console.error('[History] Error:', error);
                document.getElementById('historyList').innerHTML = `
                    <div class="col-span-full py-12 text-center text-rose-400 text-sm">
                        ⚠️ Failed to load analysis history: ${error.message}
                    </div>
                `;
            }
        }

        function displayHistory(history) {
            const container = document.getElementById('historyList');
            if (!history || history.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-500 text-sm">
                        <i class="fa-solid fa-box-open text-4xl text-slate-700 mb-3"></i>
                        <p class="text-slate-400 font-semibold">No analysis history found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = history.map(analysis => {
                const analysisDate = new Date(analysis.analysisDate || analysis.createdAt);
                const type = analysis.analysisType || analysis.type || 'General';

                return `
                    <div class="glass-panel rounded-2xl p-5 border border-slate-800 space-y-3 flex flex-col justify-between">
                        <div class="space-y-2">
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <h4 class="font-bold text-white text-base">${type}</h4>
                                    <span class="text-[11px] text-slate-400">📅 ${analysisDate.toLocaleDateString()}</span>
                                </div>
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border border-emerald-500/30 text-emerald-400 bg-emerald-500/10">
                                    Completed
                                </span>
                            </div>
                            <p class="text-xs text-slate-300 line-clamp-2">${analysis.summary || 'No summary available for this execution.'}</p>
                            
                            <div class="grid grid-cols-3 gap-2 p-3 rounded-xl bg-slate-950/60 border border-slate-900 text-center text-xs">
                                <div>
                                    <span class="text-[10px] text-slate-500 block">Insights</span>
                                    <span class="font-bold text-emerald-400">${analysis.insightsCount ?? '—'}</span>
                                </div>
                                <div>
                                    <span class="text-[10px] text-slate-500 block">Recs</span>
                                    <span class="font-bold text-amber-400">${analysis.recommendationsCount ?? '—'}</span>
                                </div>
                                <div>
                                    <span class="text-[10px] text-slate-500 block">Anomalies</span>
                                    <span class="font-bold text-rose-400">${analysis.anomaliesCount ?? '—'}</span>
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 flex items-center justify-between border-t border-slate-800/80">
                            <span class="text-[11px] text-slate-500">🕐 ${analysisDate.toLocaleTimeString()}</span>
                            <button onclick="viewDetails(${analysis.id})" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-emerald-400 text-xs font-semibold border border-slate-800 transition flex items-center gap-1">
                                <i class="fa-solid fa-eye"></i> View Details
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function displayPagination(page, total) {
            totalPages = total;
            const pagination = document.getElementById('pagination');
            if (total <= 1) {
                pagination.classList.add('hidden');
                return;
            }
            pagination.classList.remove('hidden');
            pagination.innerHTML = `
                <button onclick="goToPage(${page - 1})" ${page === 1 ? 'disabled class="opacity-50 text-slate-500"' : 'class="text-emerald-400 font-bold hover:underline"'}>&larr; Previous</button>
                <span class="text-slate-400">Page ${page} of ${total}</span>
                <button onclick="goToPage(${page + 1})" ${page === total ? 'disabled class="opacity-50 text-slate-500"' : 'class="text-emerald-400 font-bold hover:underline"'}>Next &rarr;</button>
            `;
        }

        function applyFilters() {
            currentFilters = {
                analysisType: document.getElementById('filterType').value,
                startDate: document.getElementById('filterStartDate').value,
                endDate: document.getElementById('filterEndDate').value
            };
            currentPage = 1;
            loadHistory();
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadHistory();
        }

        async function viewDetails(id) {
            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('modalBody').innerHTML = '<div class="py-8 text-center text-slate-500 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading report details...</div>';

            try {
                const response = await AuthHelper.fetchWithAuth(`${baseUrl}/api/v1/AI/analysis/${id}`);
                if (!response) return;

                const result = await response.json();
                const analysis = result.data ?? result.details ?? result;

                document.getElementById('modalBody').innerHTML = `
                    <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
                        <h4 class="font-bold text-white text-sm">📝 Execution Summary</h4>
                        <p class="text-slate-300 leading-relaxed">${analysis.summary || 'No summary available'}</p>
                    </div>

                    ${analysis.insights && analysis.insights.length > 0 ? `
                        <div class="space-y-2">
                            <h4 class="font-bold text-emerald-400 text-sm">💡 Insights (${analysis.insights.length})</h4>
                            <div class="space-y-1.5">
                                ${analysis.insights.map(i => `
                                    <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800/80">
                                        <div>${i.insightText || i.text || ''}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${analysis.recommendations && analysis.recommendations.length > 0 ? `
                        <div class="space-y-2">
                            <h4 class="font-bold text-amber-400 text-sm">💡 Recommendations (${analysis.recommendations.length})</h4>
                            <div class="space-y-1.5">
                                ${analysis.recommendations.map(r => `
                                    <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800/80">
                                        <div class="font-bold text-white">${r.title || '—'}</div>
                                        <div class="text-slate-300 mt-1">${r.description || ''}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                `;
            } catch (error) {
                document.getElementById('modalBody').innerHTML = `<div class="py-8 text-center text-rose-400 text-sm">⚠️ Failed to load details: ${error.message}</div>`;
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        async function runNewAnalysis() {
            if (!confirm('Run new AI analysis? This may take a few minutes.')) return;
            const endDate = new Date().toISOString().split('T')[0];
            const startDate = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            try {
                const response = await AuthHelper.fetchWithAuth(`${baseUrl}/api/v1/AI/analyze-patterns?startDate=${startDate}&endDate=${endDate}`, {
                    method: 'POST'
                });
                if (response.ok) {
                    alert('✅ Analysis completed!');
                    loadHistory();
                }
            } catch (error) {
                console.error('Error running analysis:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await AuthHelper.checkAuth();
            loadHistory();
        });
    </script>
</body>

</html>
